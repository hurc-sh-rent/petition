<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>陳情案件戰情儀表板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f4f2ed;
    --surface: #ffffff;
    --border: #e0ddd6;
    --text-primary: #1a1916;
    --text-secondary: #6b6860;
    --accent: #2a5caa;
    --accent-light: #e8eef9;
    --success: #1a7a4a;
    --success-light: #e6f4ec;
    --warn: #a5680e;
    --warn-light: #fbf1e0;
    --error: #c0392b;
    --error-light: #fdf0ee;
    --tag-bg: #edeae3;
  }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    padding: 40px 20px 60px;
  }

  .container { max-width: 1100px; margin: 0 auto; }

  header {
    display: flex; align-items: flex-end; justify-content: space-between;
    flex-wrap: wrap; gap: 16px; margin-bottom: 28px;
  }
  .eyebrow {
    font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--text-secondary); margin-bottom: 8px;
  }
  h1 { font-size: 26px; font-weight: 900; line-height: 1.3; }
  .scope-note { font-size: 13px; color: var(--text-secondary); margin-top: 8px; line-height: 1.6; max-width: 620px; }

  .n-day-control {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 16px;
  }
  .n-day-control label { font-size: 13px; color: var(--text-secondary); white-space: nowrap; }
  .n-day-control input {
    width: 64px; padding: 6px 8px; font-family: 'DM Mono', monospace; font-size: 15px;
    border: 1px solid var(--border); border-radius: 6px; background: var(--bg);
    color: var(--text-primary); text-align: center; outline: none;
  }
  .n-day-control input:focus { border-color: var(--accent); }

  #loading {
    display: flex; align-items: center; gap: 10px; font-size: 13px;
    color: var(--text-secondary); margin: 40px 0;
  }
  .spinner {
    width: 16px; height: 16px; border: 2px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #errorBox {
    display: none; background: var(--error-light); color: var(--error);
    padding: 14px 18px; border-radius: 10px; font-size: 13px; margin-bottom: 20px;
  }

  #dashboard { display: none; }

  .login-box {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 24px; max-width: 480px;
  }
  .login-row { display: flex; gap: 10px; margin-bottom: 12px; }
  .login-row input {
    flex: 1; padding: 12px 14px; font-family: 'Noto Sans TC', sans-serif; font-size: 14px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--bg);
    color: var(--text-primary); outline: none;
  }
  .login-row input:focus { border-color: var(--accent); }
  .login-row button {
    padding: 12px 20px; background: var(--accent); color: #fff; font-family: 'Noto Sans TC', sans-serif;
    font-size: 14px; font-weight: 500; border: none; border-radius: 8px; cursor: pointer; white-space: nowrap;
  }
  .login-row button:hover { background: #1e4a91; }
  .login-row button:disabled { background: #a0b4d4; cursor: not-allowed; }
  #loginNotice {
    display: none; font-size: 13px; padding: 10px 14px; border-radius: 8px; margin-top: 4px;
  }
  #loginNotice.error { display: block; background: var(--error-light); color: var(--error); }
  #loginNotice.success { display: block; background: var(--success-light); color: var(--success); }

  /* 大區塊：左逾期未處理／右不屬於本次處理範圍 */
  .hero-card {
    background: var(--text-primary); color: #fff; border-radius: 16px;
    padding: 32px 36px; margin-bottom: 20px;
    display: flex; gap: 32px; flex-wrap: wrap;
  }
  .hero-divider { width: 1px; background: rgba(255,255,255,0.15); align-self: stretch; }
  .hero-label {
    font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: 0.08em;
    text-transform: uppercase; color: #c2c0b6; margin-bottom: 10px;
  }
  .hero-third { flex: 1; min-width: 200px; }
  .hero-total { display: flex; flex-direction: column; justify-content: center; }
  .hero-number { font-size: 56px; font-weight: 900; line-height: 1; color: #ff9d7a; }
  .hero-number-total { color: #fff; }
  .hero-number-alt { color: #ffd166; }
  .hero-number-gray { color: #9c9a92; }
  .hero-unit { font-size: 18px; font-weight: 500; color: #c2c0b6; margin-left: 6px; }
  .hero-pct-inline { font-size: 16px; font-weight: 500; color: #c2c0b6; margin-left: 8px; }
  .hero-sub { font-size: 14px; color: #c2c0b6; margin-top: 8px; }

  /* 中區塊：狀態分布 */
  .section-title {
    font-size: 13px; font-weight: 500; color: var(--text-secondary);
    margin: 28px 0 12px; display: flex; align-items: center; gap: 8px;
  }
  .status-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px; margin-bottom: 8px;
  }
  .status-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 18px 20px;
  }
  .status-card-name { font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; }
  .status-card-count { font-size: 30px; font-weight: 700; color: var(--text-primary); }
  .status-card-pct { font-size: 13px; color: var(--accent); font-family: 'DM Mono', monospace; }
  .status-card-bar { height: 4px; border-radius: 2px; background: var(--tag-bg); margin-top: 10px; overflow: hidden; }
  .status-card-bar-fill { height: 100%; background: var(--accent); border-radius: 2px; }

  /* 圖表區 */
  .chart-row { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; margin-top: 8px; }
  .chart-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 20px 24px;
  }
  .chart-card h3 { font-size: 14px; font-weight: 500; margin-bottom: 4px; }
  .chart-card p { font-size: 12px; color: var(--text-secondary); margin-bottom: 16px; }
  .chart-wrap { position: relative; height: 320px; }

  footer { margin-top: 40px; text-align: center; font-size: 12px; color: var(--text-secondary); }

  @media (max-width: 760px) {
    .chart-row { grid-template-columns: 1fr; }
    .hero-card { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>
<div class="container">

  <div id="loginGate">
    <header>
      <div>
        <p class="eyebrow">陳情案件戰情儀表板</p>
        <h1>內部登入</h1>
        <p class="scope-note" id="loginScopeNote">輸入 Email 後會寄送驗證碼。</p>
      </div>
    </header>

    <div class="login-box">
      <div class="login-row">
        <input type="email" id="loginEmail" placeholder="請輸入您的 Email" autocomplete="email" />
        <button id="sendOtpBtn" onclick="sendOtp()">發送驗證碼</button>
      </div>
      <div class="login-row" id="otpRow" style="display:none;">
        <input type="text" id="loginOtp" placeholder="輸入 6 位數驗證碼" maxlength="6" autocomplete="one-time-code" />
        <button id="verifyOtpBtn" onclick="verifyOtp()">登入</button>
      </div>
      <div id="loginNotice" class="notice"></div>
    </div>
  </div>

  <div id="mainContent" style="display:none;">
    <header>
      <div>
        <p class="eyebrow">陳情案件戰情儀表板</p>
        <h1>案件處理總覽</h1>
        <p class="scope-note" id="scopeNote"></p>
      </div>
      <div class="n-day-control">
        <label for="daysInput">逾期天數門檻</label>
        <input type="number" id="daysInput" value="7" min="1" max="90" />
        <label>天</label>
      </div>
    </header>

    <div id="loading"><div class="spinner"></div><span>載入資料中，請稍候…</span></div>
    <div id="errorBox"></div>

    <div id="dashboard">
      <!-- 1. 大區塊：三欄，總量／逾期未處理／不屬於本次處理範圍 -->
      <div class="hero-card">
        <div class="hero-third hero-total">
          <div class="hero-label">全部案件</div>
          <div>
            <span class="hero-number hero-number-total" id="totalCount">0</span><span class="hero-unit">件</span>
          </div>
        </div>
        <div class="hero-divider"></div>
        <div class="hero-third">
          <div class="hero-label">逾期未處理（超過門檻天數、處理狀態仍空白）</div>
          <div>
            <span class="hero-number" id="overdueCount">0</span><span class="hero-unit">件</span><span class="hero-pct-inline" id="overduePct"></span>
            <div class="hero-sub" id="overdueSub"></div>
          </div>
        </div>
        <div class="hero-divider"></div>
        <div class="hero-third">
          <div class="hero-label">不屬於本次處理範圍</div>
          <div>
            <span class="hero-number hero-number-alt" id="outOfScopeCount">0</span><span class="hero-unit">件</span><span class="hero-pct-inline" id="outOfScopePct"></span>
            <div class="hero-sub">非寄居蟹租屋公司房東房客，或非社會住宅包租代管案件</div>
          </div>
        </div>
        <div class="hero-divider"></div>
        <div class="hero-third">
          <div class="hero-label">排除跳題（無縣市）</div>
          <div>
            <span class="hero-number hero-number-gray" id="noCityCount">0</span><span class="hero-unit">件</span>
            <div class="hero-sub">一開頭就被排除跳題到問卷結尾，縣市等後續欄位未填寫，不計入以上統計</div>
          </div>
        </div>
      </div>

      <!-- 2. 中區塊：處理狀態分布 -->
      <div class="section-title">處理狀態分布（已有狀態的案件）</div>
      <div class="status-grid" id="statusGrid"></div>

      <!-- 3 + 4. 圖表 -->
      <div class="chart-row">
        <div class="chart-card">
          <h3>各縣市處理進度</h3>
          <p>未處理（範疇內／範疇外）與已處理案件量堆疊比較</p>
          <div class="chart-wrap"><canvas id="cityBarChart"></canvas></div>
        </div>
        <div class="chart-card">
          <h3>案件量縣市分布</h3>
          <p>全部案件依縣市分組佔比</p>
          <div class="chart-wrap"><canvas id="cityPieChart"></canvas></div>
        </div>
      </div>
    </div>

    <footer>資料來源：Google 表單回應試算表</footer>
  </div>

</div>

<script>
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxQ0HC8vVMFoNagqvfKwxzMr560dO2HCpd02JxYe1tajazQ_be74H__R-jDRcL_Fsr6Rg/exec";

  const CHART_COLORS = ['#2a5caa', '#c98a4b', '#5a9b7a', '#a5678e', '#6b8fb5', '#c0392b', '#8a7ca8', '#b5a15a'];

  let dashboardToken = null; // 只存在記憶體，重新整理頁面就要重新登入
  let allRows = [];
  let barChart = null;
  let pieChart = null;

  async function loadData() {
    if (typeof Chart === 'undefined') {
      const box = document.getElementById('errorBox');
      document.getElementById('loading').style.display = 'none';
      box.style.display = 'block';
      box.textContent = '圖表套件（Chart.js）載入失敗，請確認網路連線或重新整理頁面再試一次。';
      return;
    }
    try {
      const hadToken = !!dashboardToken; // 用來分辨「本來就沒登入過」跟「登入過但過期了」
      // cache: 'no-store' + 網址帶隨機值：避免瀏覽器把這個請求的回應快取住，
      // 每次 reload 都保證是真的打到後端拿最新資料，不是吃到舊的快取回應
      const cacheBuster = Date.now();
      const res = await fetch(
        `${WEB_APP_URL}?action=dashboard&token=${encodeURIComponent(dashboardToken || '')}&_=${cacheBuster}`,
        { redirect: 'follow', cache: 'no-store' }
      );
      const data = await res.json();

      if (data.code === 'AUTH_REQUIRED') {
        // token 過期或無效，退回登入頁重新驗證，不是資料錯誤
        dashboardToken = null;
        document.getElementById('mainContent').style.display = 'none';
        document.getElementById('loginGate').style.display = 'block';
        renderLoginScopeNote(data.allowedDomains); // 允許的網域清單由後端決定，前端不寫死，避免兩邊兜不起來
        if (hadToken) showLoginNotice('error', '登入已過期，請重新驗證。'); // 第一次載入（本來就沒登入過）不用顯示這句，避免誤導
        return;
      }
      if (data.status !== 'ok') throw new Error(data.message || '資料載入失敗');

      allRows = data.rows;
      renderScopeNote(data.outOfScopeConditions);
      document.getElementById('noCityCount').textContent = data.noCityCount || 0; // 固定值，不隨N天門檻重算
      document.getElementById('loginGate').style.display = 'none';   // 拿到資料就代表不需要登入頁了，關掉
      document.getElementById('mainContent').style.display = 'block'; // 外層容器本身也要打開，不然裡面渲染了也看不到
      document.getElementById('loading').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      render();
    } catch (err) {
      document.getElementById('loading').style.display = 'none';
      const box = document.getElementById('errorBox');
      box.style.display = 'block';
      box.textContent = '載入失敗：' + err.message;
    }
  }

  // ===== 登入相關 =====
  function showLoginNotice(type, text) {
    const el = document.getElementById('loginNotice');
    el.className = type;
    el.textContent = text;
  }

  // 依後端回傳的允許網域清單，動態組出登入頁的說明文字跟輸入框提示，不寫死在 HTML 裡——
  // 網域之後不管改成幾個、改成什麼，這裡都不用跟著改
  function renderLoginScopeNote(domains) {
    const domainsText = (domains && domains.length > 0) ? domains.join('、') : '';
    const noteEl = document.getElementById('loginScopeNote');
    if (noteEl) {
      noteEl.textContent = domainsText
        ? `僅開放 ${domainsText} 網域帳號使用，輸入 Email 後會寄送驗證碼。`
        : '輸入 Email 後會寄送驗證碼。';
    }
    const inputEl = document.getElementById('loginEmail');
    if (inputEl) {
      inputEl.placeholder = domainsText ? `請輸入 ${domainsText} 信箱` : '請輸入您的 Email';
    }
  }

  async function sendOtp() {
    const email = document.getElementById('loginEmail').value.trim();
    if (!email) { showLoginNotice('error', '請輸入 Email。'); return; }

    const btn = document.getElementById('sendOtpBtn');
    btn.disabled = true;
    showLoginNotice('', '');
    document.getElementById('loginNotice').className = '';

    try {
      const res = await fetch(`${WEB_APP_URL}?action=sendDashboardOtp&email=${encodeURIComponent(email)}&_=${Date.now()}`, { redirect: 'follow', cache: 'no-store' });
      const data = await res.json();
      if (data.status !== 'sent') {
        showLoginNotice('error', data.message || '發送失敗，請稍後再試。');
        btn.disabled = false;
        return;
      }
      document.getElementById('otpRow').style.display = 'flex';
      document.getElementById('loginEmail').disabled = true;
      showLoginNotice('success', `驗證碼已寄至 ${email}，5 分鐘內有效。`);
      document.getElementById('loginOtp').focus();
    } catch (err) {
      showLoginNotice('error', '發送失敗：' + err.message);
      btn.disabled = false;
    }
  }

  async function verifyOtp() {
    const email = document.getElementById('loginEmail').value.trim();
    const otp = document.getElementById('loginOtp').value.trim();
    if (otp.length !== 6) { showLoginNotice('error', '請輸入 6 位數驗證碼。'); return; }

    const btn = document.getElementById('verifyOtpBtn');
    btn.disabled = true;

    try {
      const res = await fetch(`${WEB_APP_URL}?action=verifyDashboardOtp&email=${encodeURIComponent(email)}&otp=${encodeURIComponent(otp)}&_=${Date.now()}`, { redirect: 'follow', cache: 'no-store' });
      const data = await res.json();
      if (data.status !== 'ok') {
        showLoginNotice('error', data.message || '驗證失敗。');
        btn.disabled = false;
        return;
      }

      dashboardToken = data.token;
      document.getElementById('loginGate').style.display = 'none';
      document.getElementById('mainContent').style.display = 'block';
      loadData();
    } catch (err) {
      showLoginNotice('error', '驗證失敗：' + err.message);
      btn.disabled = false;
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('loginEmail').addEventListener('keydown', e => { if (e.key === 'Enter') sendOtp(); });
    document.getElementById('loginOtp').addEventListener('keydown', e => { if (e.key === 'Enter') verifyOtp(); });
  });

  // 依後端回傳的範疇外判斷條件（不限 2 個，且每個欄位可以有各自不同的判斷值），
  // 動態組出頁面頂端的定義說明文字，不寫死在 HTML 裡——欄位跟判斷值之後不管怎麼調，這裡都不用改
  function renderScopeNote(conditions) {
    const el = document.getElementById('scopeNote');
    if (!conditions || conditions.length === 0) {
      el.textContent = '範疇外定義：目前沒有設定任何判斷欄位（FIELD_CONFIG 裡找不到 OUT_OF_SCOPE_FIELD_ 開頭的設定）。';
      return;
    }
    const text = conditions.map(cond => `「${cond.fieldName}」=${cond.value}`).join('，或 ');
    el.textContent = `範疇外定義：${text}（符合其中一項即列入範疇外）`;
  }

  function render() {
    const days = Math.max(1, parseInt(document.getElementById('daysInput').value, 10) || 7);
    const stats = computeStats(allRows, days);
    renderHero(stats, days);
    renderStatusGrid(stats);
    renderCityBarChart(stats);
    renderCityPieChart(stats);
  }

  /**
   * 依原始資料算出：
   * - overdueCount：處理狀態空白、且距今超過 N 天的案件數
   * - statusCounts：處理狀態非空白的各種值各自的數量
   * - cityStats：每個縣市的 { unprocessed（處理狀態空白）, processed（處理狀態非空白）, total }
   * 所有百分比都是「佔全部案件」的比例，不是佔某個子集合的比例。
   */
  function computeStats(rows, days) {
    const now = Date.now();
    const thresholdMs = days * 24 * 60 * 60 * 1000;
    const total = rows.length;

    let overdueCount = 0;
    let outOfScopeCount = 0;
    const statusCounts = {};
    const cityStats = {};

    rows.forEach(r => {
      const isBlank = !r.status || !r.status.trim();
      const ts = new Date(r.timestamp).getTime();
      const age = isNaN(ts) ? 0 : now - ts;

      if (isBlank) {
        if (age >= thresholdMs) overdueCount++;
      } else {
        statusCounts[r.status] = (statusCounts[r.status] || 0) + 1;
      }

      if (r.outOfScope) outOfScopeCount++;

      const city = r.city && r.city.trim() ? r.city : '（未填縣市）';
      if (!cityStats[city]) cityStats[city] = { unprocessedInScope: 0, unprocessedOutScope: 0, processed: 0, total: 0 };
      cityStats[city].total++;
      if (isBlank) {
        if (r.outOfScope) cityStats[city].unprocessedOutScope++; else cityStats[city].unprocessedInScope++;
      } else {
        cityStats[city].processed++;
      }
    });

    return { total, overdueCount, outOfScopeCount, statusCounts, cityStats };
  }

  function pct(n, total) {
    if (!total) return '0%';
    return `${((n / total) * 100).toFixed(1)}%`;
  }

  function renderHero(stats, days) {
    document.getElementById('totalCount').textContent = stats.total;

    document.getElementById('overdueCount').textContent = stats.overdueCount;
    document.getElementById('overduePct').textContent = `（${pct(stats.overdueCount, stats.total)}）`;
    document.getElementById('overdueSub').textContent = `門檻：提出超過 ${days} 天、處理狀態仍未填寫`;

    document.getElementById('outOfScopeCount').textContent = stats.outOfScopeCount;
    document.getElementById('outOfScopePct').textContent = `（${pct(stats.outOfScopeCount, stats.total)}）`;
  }

  function renderStatusGrid(stats) {
    const grid = document.getElementById('statusGrid');
    const entries = Object.entries(stats.statusCounts).sort((a, b) => b[1] - a[1]);

    if (entries.length === 0) {
      grid.innerHTML = `<div class="status-card"><div class="status-card-name">目前沒有已填寫處理狀態的案件</div></div>`;
      return;
    }

    grid.innerHTML = entries.map(([status, count]) => {
      const percentText = pct(count, stats.total);
      const percentValue = stats.total ? (count / stats.total) * 100 : 0;
      return `
        <div class="status-card">
          <div class="status-card-name">${escapeHtml(status)}</div>
          <div class="status-card-count">${count}</div>
          <div class="status-card-pct">${percentText}</div>
          <div class="status-card-bar"><div class="status-card-bar-fill" style="width:${percentValue}%"></div></div>
        </div>`;
    }).join('');
  }

  function renderCityBarChart(stats) {
    const cities = Object.keys(stats.cityStats).sort((a, b) => stats.cityStats[b].total - stats.cityStats[a].total);
    const unprocessedInScope = cities.map(c => stats.cityStats[c].unprocessedInScope);
    const unprocessedOutScope = cities.map(c => stats.cityStats[c].unprocessedOutScope);
    const processed = cities.map(c => stats.cityStats[c].processed);

    if (barChart) barChart.destroy();
    barChart = new Chart(document.getElementById('cityBarChart'), {
      type: 'bar',
      data: {
        labels: cities,
        datasets: [
          { label: '未處理（範疇內）', data: unprocessedInScope, backgroundColor: '#c0392b' },
          { label: '未處理（範疇外）', data: unprocessedOutScope, backgroundColor: '#9c9a92' },
          { label: '已處理', data: processed, backgroundColor: '#1a7a4a' }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        scales: {
          x: { stacked: true, grid: { display: false } },
          y: { stacked: true, beginAtZero: true, ticks: { precision: 0 } }
        },
        plugins: { legend: { position: 'top', labels: { boxWidth: 12, font: { size: 12 } } } }
      }
    });
  }

  function renderCityPieChart(stats) {
    const cities = Object.keys(stats.cityStats).sort((a, b) => stats.cityStats[b].total - stats.cityStats[a].total);
    const totals = cities.map(c => stats.cityStats[c].total);

    if (pieChart) pieChart.destroy();
    pieChart = new Chart(document.getElementById('cityPieChart'), {
      type: 'pie',
      data: {
        labels: cities,
        datasets: [{ data: totals, backgroundColor: cities.map((_, i) => CHART_COLORS[i % CHART_COLORS.length]) }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'right', labels: { boxWidth: 12, font: { size: 11 } } } }
      }
    });
  }

  function escapeHtml(value) {
    const MAP = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
    return String(value ?? "").replace(/[&<>"']/g, c => MAP[c]);
  }

  document.getElementById('daysInput').addEventListener('input', () => {
    if (allRows.length > 0) render();
  });

  // 先直接嘗試載入資料，不預設一定要先登入——如果後端要求 OTP 驗證，
  // 會收到 AUTH_REQUIRED 並自動顯示登入頁；如果後端關掉了 OTP 驗證，就直接顯示資料
  loadData();
</script>
</body>
</html>
