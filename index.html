<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>寄居蟹及兆基專案協助登記表查詢</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #efeeeb;
    --surface: #ffffff;
    --border: #e3e0d8;
    --text-primary: #2b2519;
    --text-secondary: #7a7364;
    --accent: #1f469a;
    --accent-light: #e8eef8;
    --success: #4a6741;
    --success-light: #eaf0e6;
    --warn: #a5680e;
    --warn-light: #fbf1e0;
    --error: #c0392b;
    --error-light: #fdf0ee;
    --tag-bg: #ece9e2;
    --form-brown: #5e5137;
    --form-brown-light: #f2efe9;
    --status-processed: #dd7a1f;
  }

  body {
    font-size: 16px;
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    padding: 48px 20px;
  }

  .container { width: min(96%, 1200px); margin: 0 auto; }
  header, .search-box { max-width: 640px; margin-left: auto; margin-right: auto; }

  header { margin-bottom: 32px; }
  .brand-logo { height: 28px; width: auto; margin-bottom: 18px; display: block; }
  .eyebrow {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-secondary);
    margin-bottom: 10px;
  }
  h1 { font-size: 30px; font-weight: 700; line-height: 1.3; }
  .subtitle { margin-top: 8px; font-size: 16px; color: var(--text-secondary); line-height: 1.6; }

  .search-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: 3px solid var(--form-brown);
    border-radius: 14px;
    padding: 24px;
    margin-bottom: 28px;
  }

  .input-row { display: flex; gap: 10px; }
  .input-wrapper { flex: 1; position: relative; }
  .input-wrapper svg {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    color: var(--text-secondary); pointer-events: none;
  }

  input[type="text"] {
    width: 100%;
    padding: 12px 14px 12px 42px;
    font-family: 'DM Mono', monospace;
    font-size: 17px;
    letter-spacing: 0.03em;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text-primary);
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
    text-transform: uppercase;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(31,70,154,0.12); }
  input::placeholder { color: var(--text-secondary); text-transform: none; }

  button {
    padding: 12px 24px;
    background: var(--accent);
    color: #fff;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 16px;
    font-weight: 500;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s, transform 0.1s;
  }
  button:hover { background: #163875; }
  button:active { transform: scale(0.97); }
  button:disabled { background: #9caed4; cursor: not-allowed; }

  .hint { margin-top: 10px; font-size: 14px; color: var(--text-secondary); }

  .notice {
    margin-top: 14px; padding: 10px 14px; border-radius: 8px; font-size: 13px;
    display: none; align-items: flex-start; gap: 8px;
  }
  .notice.error { background: var(--error-light); color: var(--error); display: flex; }
  .notice.empty { background: var(--tag-bg); color: var(--text-secondary); display: flex; }

  #loading {
    display: none; align-items: center; gap: 10px;
    font-size: 13px; color: var(--text-secondary); margin-top: 14px;
  }
  .spinner {
    width: 16px; height: 16px; border: 2px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .results-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; max-width: 640px; margin-left: auto; margin-right: auto; }
  .results-title { font-size: 15px; font-weight: 500; color: var(--text-secondary); }
  .badge {
    font-family: 'DM Mono', monospace; font-size: 13px;
    background: var(--success-light); color: var(--success);
    padding: 3px 10px; border-radius: 20px;
  }

  .results-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
    gap: 16px;
  }

  .record-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    overflow: hidden; animation: fadeUp 0.25s ease both;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .record-head {
    padding: 14px 20px; display: flex; align-items: center; justify-content: space-between;
    background: var(--form-brown); gap: 12px;
  }
  .record-index { font-family: 'DM Mono', monospace; font-size: 13px; color: rgba(255,255,255,0.72); }
  .record-eta { font-size: 14px; color: rgba(255,255,255,0.72); margin-top: 3px; }
  .record-city { font-size: 17px; font-weight: 500; margin-top: 6px; color: #ffffff; }

  .status-tag {
    display: inline-block; padding: 4px 14px; border-radius: 20px;
    font-size: 14px; font-weight: 500; white-space: nowrap; flex-shrink: 0;
  }
  .status-default { background: rgba(255,255,255,0.85); color: var(--text-secondary); }
  .status-processed { background: var(--status-processed); color: #fff; font-weight: 700; }

  .field-row {
    display: grid; grid-template-columns: 150px 1fr; gap: 0;
    border-top: 1px solid var(--border); font-size: 15px;
  }
  .field-label {
    padding: 11px 16px; color: var(--text-secondary); background: var(--form-brown-light);
    font-size: 14px; border-right: 1px solid var(--border);
    display: flex; align-items: flex-start; line-height: 1.5; white-space: nowrap;
  }
  .field-value { padding: 11px 20px; color: var(--text-primary); line-height: 1.6; word-break: break-word; }
  .field-value.empty { color: var(--text-secondary); }

  footer { margin-top: 40px; text-align: center; font-size: 14px; color: var(--text-secondary); }

  @media (max-width: 480px) {
    .input-row { flex-direction: column; }
    .field-row { grid-template-columns: 1fr; }
    .field-label { border-right: none; border-bottom: 1px solid var(--border); background: var(--form-brown-light); }
  }
</style>
</head>

<script>
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxQ0HC8vVMFoNagqvfKwxzMr560dO2HCpd02JxYe1tajazQ_be74H__R-jDRcL_Fsr6Rg/exec";

  // 後端 queryByIdNumber 回傳的欄位 -> 這頁顯示用的中文標籤
  const FIELD_LABELS = {
    "時間戳記": "受理時間",
    "INTENTION": "案件類型",
    "CITY": "縣市",
    "公會指定業者": "公會指定業者",
    "處理狀態": "處理狀態",
    "無需處理之理由": "無需處理之理由",
    "UPDATE_TIME": "最後更新時間"
  };
  // 主表裡「您希望接洽的業者？」因表單分支被拆成 6 個同名欄位，
  // 後端 queryByIdNumber 已經合併成單一的「民眾指定業者」回傳，前端不用再自己找

  function escapeHtml(value) {
    const MAP = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
    return String(value ?? "").replace(/[&<>"']/g, c => MAP[c]);
  }
  function showNotice(type, text) {
    const el = document.getElementById("notice");
    el.className = `notice ${type}`;
    el.textContent = text;
  }
  function clearNotice() {
    const el = document.getElementById("notice");
    el.className = "notice";
    el.textContent = "";
  }
  function statusClass(status) {
    const key = (status || "").replace(/\s/g, "");
    return key ? "status-processed" : "status-default"; // 空白＝尚未處理(灰)，其他任何值一律綠色
  }

  async function query() {
    const id = document.getElementById("idInput").value.trim().toUpperCase();
    clearNotice();
    if (!id) { showNotice("error", "請輸入身分證字號。"); return; }

    const btn = document.getElementById("queryBtn");
    btn.disabled = true;
    document.getElementById("loading").style.display = "flex";
    document.getElementById("results").innerHTML = "";

    try {
      const res = await fetch(`${WEB_APP_URL}?action=query&id=${encodeURIComponent(id)}`, { redirect: 'follow' });
      const data = await res.json();

      if (data.status !== "ok") {
        showNotice("error", data.message || "查詢失敗，請稍後再試。");
        return;
      }
      if (data.count === 0) {
        showNotice("empty", "找不到對應的案件，請確認身分證字號是否正確。");
        return;
      }

      renderResults(data);
    } catch (err) {
      showNotice("error", "查詢失敗：" + err.message);
    } finally {
      btn.disabled = false;
      document.getElementById("loading").style.display = "none";
    }
  }

  function renderResults(data) {
    let html = `
      <div class="results-header">
        <span class="results-title">查詢結果</span>
        <span class="badge">共 ${data.count} 筆</span>
      </div>
      <div class="results-grid">`;

    data.rows.forEach((row, idx) => {
      const rawStatus = row["處理狀態"]; // 用來判斷顏色，維持原始空白值，不要被顯示用的預設文字污染
      const statusText = rawStatus || "尚未處理"; // 純粹給畫面顯示用
      const etaLine = rawStatus ? "" : `<div class="record-eta">提交申請後 7 日內會為您進行處理，感謝您的耐心等候。</div>`;
      html += `
        <div class="record-card">
          <div class="record-head">
            <div>
              <div class="record-index">第 ${idx + 1} 筆・${escapeHtml(row["時間戳記"] || "")}</div>
              ${etaLine}
              <div class="record-city">${escapeHtml(row["CITY"] || "")}</div>
            </div>
            <span class="status-tag ${statusClass(rawStatus)}">${escapeHtml(statusText)}</span>
          </div>
          ${renderFields(row)}
        </div>`;
    });

    html += `</div>`;
    document.getElementById("results").innerHTML = html;
  }

  function renderFields(row) {
    let html = "";

    // 固定欄位（時間戳記已在卡頭顯示，CITY 已在卡頭顯示，處理狀態已用標籤顯示，這裡不重複）
    ["INTENTION", "無需處理之理由"].forEach(field => {
      html += fieldRow(FIELD_LABELS[field], row[field]);
    });

    // 「您希望接洽的業者？」因表單分支被拆成 6 個同名欄位，
    // 後端已經合併好只回傳一個值，這裡直接顯示
    html += fieldRow("民眾指定業者", firmDisplay(row, row["民眾指定業者"]));

    html += fieldRow(FIELD_LABELS["公會指定業者"], firmDisplay(row, row["公會指定業者"]));
    html += fieldRow(FIELD_LABELS["UPDATE_TIME"], row["UPDATE_TIME"]);

    return html;
  }

  // 業者名稱後面加上電話（來自後端 firmContacts），沒有電話資料就只顯示名稱
  function firmDisplay(row, name) {
    if (!name || !name.trim()) return "";
    const contact = row.firmContacts && row.firmContacts[name];
    if (!contact || !contact.tel) return name;
    return `${name}（如有疑問請洽詢業者，電話 ${contact.tel}）`;
  }

  function fieldRow(label, value) {
    const hasValue = value && String(value).trim() !== "";
    return `
      <div class="field-row">
        <div class="field-label">${escapeHtml(label)}</div>
        <div class="field-value ${hasValue ? "" : "empty"}">${hasValue ? escapeHtml(value) : "尚無資料"}</div>
      </div>`;
  }

  document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("idInput").addEventListener("keydown", e => {
      if (e.key === "Enter") query();
    });
  });
</script>
</body>
</html>
